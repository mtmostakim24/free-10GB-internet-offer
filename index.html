<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Daily Earning 545 | লোড হচ্ছে...</title>
    <style>
        :root {
            --bg-deep: #0a0a1a;
            --accent-cyan: #00e5ff;
            --accent-gold: #ffb300;
            --accent-purple: #b388ff;
            --glass-bg: rgba(18, 18, 38, 0.65);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-primary: #f0f0ff;
            --text-secondary: #b0b0d0;
            --shadow-glow: 0 0 50px rgba(0, 229, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--bg-deep);
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(0, 229, 255, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 90%, rgba(179, 136, 255, 0.1) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 179, 0, 0.04) 0%, transparent 60%),
                linear-gradient(180deg, #0a0a1a 0%, #0d0d28 40%, #0f0f2e 100%);
            font-family: 'Segoe UI', 'Poppins', 'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── ফ্লোটিং পার্টিকেল ── */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: drift linear infinite;
            opacity: 0;
        }

        .particle:nth-child(1) {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            top: 15%;
            left: 10%;
            animation-duration: 14s;
            animation-delay: 0s;
            box-shadow: 0 0 14px var(--accent-cyan);
        }
        .particle:nth-child(2) {
            width: 4px;
            height: 4px;
            background: var(--accent-gold);
            top: 70%;
            left: 80%;
            animation-duration: 18s;
            animation-delay: 2s;
            box-shadow: 0 0 10px var(--accent-gold);
        }
        .particle:nth-child(3) {
            width: 5px;
            height: 5px;
            background: var(--accent-purple);
            top: 30%;
            left: 75%;
            animation-duration: 20s;
            animation-delay: 4s;
            box-shadow: 0 0 12px var(--accent-purple);
        }
        .particle:nth-child(4) {
            width: 7px;
            height: 7px;
            background: var(--accent-cyan);
            top: 60%;
            left: 20%;
            animation-duration: 16s;
            animation-delay: 1s;
            box-shadow: 0 0 16px var(--accent-cyan);
        }
        .particle:nth-child(5) {
            width: 3px;
            height: 3px;
            background: #fff;
            top: 85%;
            left: 45%;
            animation-duration: 22s;
            animation-delay: 3s;
            box-shadow: 0 0 8px #fff;
        }
        .particle:nth-child(6) {
            width: 5px;
            height: 5px;
            background: var(--accent-gold);
            top: 10%;
            left: 55%;
            animation-duration: 19s;
            animation-delay: 5s;
            box-shadow: 0 0 11px var(--accent-gold);
        }
        .particle:nth-child(7) {
            width: 4px;
            height: 4px;
            background: var(--accent-purple);
            top: 45%;
            left: 90%;
            animation-duration: 24s;
            animation-delay: 0s;
            box-shadow: 0 0 10px var(--accent-purple);
        }
        .particle:nth-child(8) {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            top: 50%;
            left: 5%;
            animation-duration: 15s;
            animation-delay: 6s;
            box-shadow: 0 0 13px var(--accent-cyan);
        }

        @keyframes drift {
            0% {
                transform: translateY(0) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
                transform: translateY(-20px) translateX(10px) scale(1.3);
            }
            30% {
                opacity: 0.7;
                transform: translateY(-50px) translateX(-15px) scale(0.9);
            }
            50% {
                opacity: 0.5;
                transform: translateY(-90px) translateX(20px) scale(1.4);
            }
            70% {
                opacity: 0.3;
                transform: translateY(-130px) translateX(-10px) scale(0.7);
            }
            90% {
                opacity: 0.1;
                transform: translateY(-170px) translateX(5px) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) translateX(0) scale(0);
            }
        }

        /* ── অরবিটাল রিং (ব্যাকগ্রাউন্ড) ── */
        .orbital-ring {
            position: fixed;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            pointer-events: none;
            z-index: 0;
        }
        .orbital-ring.ring-1 {
            width: 600px;
            height: 600px;
            top: calc(50% - 300px);
            left: calc(50% - 300px);
            animation: rotateSlow 60s linear infinite;
            border-color: rgba(0, 229, 255, 0.06);
        }
        .orbital-ring.ring-2 {
            width: 400px;
            height: 400px;
            top: calc(50% - 200px);
            left: calc(50% - 200px);
            animation: rotateSlow 45s linear infinite reverse;
            border-color: rgba(179, 136, 255, 0.05);
        }

        @keyframes rotateSlow {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ── প্রধান কন্টেইনার ── */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 460px;
            animation: fadeInUp 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── গ্লাস কার্ড ── */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                var(--shadow-glow);
            padding: 2.5rem 2rem 2.8rem;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 30px;
            right: 30px;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.35),
                    rgba(0, 229, 255, 0.5),
                    rgba(255, 255, 255, 0.35),
                    transparent);
            border-radius: 50%;
        }

        /* ── টপ গ্লো ডট ── */
        .glow-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-cyan);
            margin: 0 auto 1.2rem;
            box-shadow: 0 0 20px var(--accent-cyan), 0 0 40px rgba(0, 229, 255, 0.4);
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%,
            100% {
                box-shadow: 0 0 20px var(--accent-cyan), 0 0 40px rgba(0, 229, 255, 0.4);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 35px var(--accent-cyan), 0 0 70px rgba(0, 229, 255, 0.7);
                transform: scale(1.6);
            }
        }

        /* ── লোগো আইকন ── */
        .logo-icon {
            font-size: 3.5rem;
            margin-bottom: 0.3rem;
            display: inline-block;
            animation: gentleBounce 3s ease-in-out infinite;
        }

        @keyframes gentleBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-12px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-6px);
            }
            85% {
                transform: translateY(0);
            }
        }

        .logo-icon .icon-glow {
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(255, 179, 0, 0.6));
        }

        /* ── টাইটেল ── */
        .brand-title {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 0%, #d4eaff 40%, #ffd54f 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin-bottom: 0.25rem;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 0.82rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            font-weight: 500;
            opacity: 0.8;
        }

        /* ── লোডার সেকশন ── */
        .loader-section {
            position: relative;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.5rem 0 1.8rem;
        }

        /* লোডিং স্পিনার (৩ সেকেন্ড পর্যন্ত দেখাবে) */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .loading-spinner.hidden {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
            position: absolute;
        }

        .spinner-ripple {
            width: 56px;
            height: 56px;
            position: relative;
        }

        .spinner-ripple div {
            position: absolute;
            border: 3px solid var(--accent-cyan);
            border-radius: 50%;
            animation: ripple 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            opacity: 0;
        }

        .spinner-ripple div:nth-child(1) {
            animation-delay: 0s;
        }
        .spinner-ripple div:nth-child(2) {
            animation-delay: 0.5s;
            border-color: var(--accent-purple);
        }
        .spinner-ripple div:nth-child(3) {
            animation-delay: 1s;
            border-color: var(--accent-gold);
        }

        @keyframes ripple {
            0% {
                top: 50%;
                left: 50%;
                width: 0;
                height: 0;
                opacity: 1;
                transform: translate(-50%, -50%);
            }
            100% {
                top: 50%;
                left: 50%;
                width: 56px;
                height: 56px;
                opacity: 0;
                transform: translate(-50%, -50%);
            }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 0.85rem;
            letter-spacing: 1px;
            animation: fadeText 2s ease-in-out infinite;
        }

        @keyframes fadeText {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* ── বাটন সেকশন (লোডিং শেষে দেখাবে) ── */
        .button-section {
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .button-section.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .btn-open-site {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 38px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #0a0a1a;
            background: linear-gradient(135deg, #00e5ff 0%, #ffb300 70%, #ff8a00 100%);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow:
                0 8px 30px rgba(0, 229, 255, 0.35),
                0 0 0 0 rgba(0, 229, 255, 0.5);
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .btn-open-site::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
            border-radius: 60px;
            pointer-events: none;
        }

        .btn-open-site:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow:
                0 14px 40px rgba(0, 229, 255, 0.5),
                0 0 0 6px rgba(0, 229, 255, 0.12);
            background: linear-gradient(135deg, #33eaff 0%, #ffc233 70%, #ff9a1a 100%);
        }

        .btn-open-site:active {
            transform: translateY(0) scale(0.97);
            box-shadow:
                0 4px 16px rgba(0, 229, 255, 0.3);
            transition: all 0.1s ease;
        }

        .btn-open-site .btn-icon {
            font-size: 1.3rem;
            animation: btnIconPulse 1.8s ease-in-out infinite;
        }

        @keyframes btnIconPulse {
            0%,
            100% {
                transform: translateX(0);
            }
            40% {
                transform: translateX(5px);
            }
            60% {
                transform: translateX(-2px);
            }
        }

        .btn-open-site .btn-text {
            font-family: 'Segoe UI', 'Poppins', 'Noto Sans Bengali', sans-serif;
        }

        /* ── ফুটার ── */
        .footer-tag {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }

        .footer-tag .secure-icon {
            display: inline-block;
            margin: 0 3px;
            color: var(--accent-cyan);
            font-size: 0.65rem;
        }

        /* ── রেস্পন্সিভ ── */
        @media (max-width: 480px) {
            .glass-card {
                border-radius: 32px;
                padding: 2rem 1.4rem 2.2rem;
            }
            .brand-title {
                font-size: 1.35rem;
            }
            .brand-subtitle {
                font-size: 0.7rem;
                letter-spacing: 1.5px;
            }
            .btn-open-site {
                padding: 13px 28px;
                font-size: 1rem;
                gap: 7px;
            }
            .logo-icon {
                font-size: 2.8rem;
            }
            .loader-section {
                height: 70px;
            }
            .spinner-ripple {
                width: 44px;
                height: 44px;
            }
            .spinner-ripple div {
                border-width: 2.5px;
            }
            @keyframes ripple {
                0% {
                    width: 0;
                    height: 0;
                    opacity: 1;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                }
                100% {
                    width: 44px;
                    height: 44px;
                    opacity: 0;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                }
            }
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড পার্টিকেল -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- অরবিটাল রিং -->
    <div class="orbital-ring ring-1"></div>
    <div class="orbital-ring ring-2"></div>

    <!-- প্রধান কন্টেইনার -->
    <div class="main-container">
        <div class="glass-card">
            <!-- গ্লো ডট -->
            <div class="glow-dot"></div>

            <!-- লোগো -->
            <div class="logo-icon">
                <span class="icon-glow">⚡💎</span>
            </div>

            <!-- ব্র্যান্ড নাম -->
            <h1 class="brand-title">Daily Earning 545</h1>
            <p class="brand-subtitle">✦ প্রিমিয়াম প্ল্যাটফর্ম ✦</p>

            <!-- লোডার + বাটন সেকশন -->
            <div class="loader-section" id="loaderSection">
                <!-- লোডিং স্পিনার (প্রথম ৩ সেকেন্ড) -->
                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner-ripple">
                        <div></div>
                        <div></div>
                        <div></div>
                    </div>
                    <span class="loading-text">প্রস্তুত হচ্ছে...</span>
                </div>

                <!-- বাটন (৩ সেকেন্ড পর ভিজিবল) -->
                <div class="button-section" id="buttonSection">
                    <button class="btn-open-site" id="openSiteBtn" title="সাইট খুলুন">
                        <span class="btn-icon">🚀</span>
                        <span class="btn-text">Open the Site</span>
                        <span class="btn-icon" style="font-size:0.9rem;">➜</span>
                    </button>
                </div>
            </div>

            <!-- ফুটার -->
            <div class="footer-tag">
                <span class="secure-icon">🔒</span> নিরাপদ ও নির্ভরযোগ্য
                <span class="secure-icon">🔒</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ─── গন্তব্য URL ───
            const DESTINATION_URL = "https://dailyearning545.vercel.app";

            // ─── DOM রেফারেন্স ───
            const loadingSpinner = document.getElementById('loadingSpinner');
            const buttonSection = document.getElementById('buttonSection');
            const openSiteBtn = document.getElementById('openSiteBtn');
            const loaderSection = document.getElementById('loaderSection');

            // ─── ফ্ল্যাগ (একবারই রিডাইরেক্ট হবে) ───
            let redirectTriggered = false;

            // ─── রিডাইরেক্ট ফাংশন ───
            function redirectToSite() {
                if (redirectTriggered) return;
                redirectTriggered = true;
                if (DESTINATION_URL && DESTINATION_URL !== '#') {
                    // ছোট্ট ডিলে দিয়ে স্মুথ ট্রানজিশন
                    setTimeout(() => {
                        window.location.href = DESTINATION_URL;
                    }, 150);
                } else {
                    console.warn('⚠️ গন্তব্য URL সেট করা নেই!');
                }
            }

            // ─── বাটন ক্লিক ইভেন্ট ───
            if (openSiteBtn) {
                openSiteBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (!redirectTriggered) {
                        // ক্লিকের ফিডব্যাক
                        this.style.transform = 'scale(0.94)';
                        this.style.boxShadow = '0 2px 10px rgba(0,229,255,0.4)';
                        setTimeout(() => {
                            this.style.transform = '';
                            this.style.boxShadow = '';
                        }, 150);
                        redirectToSite();
                    }
                });
            }

            // ─── ৩ সেকেন্ড পর লোডার হাইড → বাটন শো ───
            const LOADING_DURATION = 3000; // ৩ সেকেন্ড (মিলিসেকেন্ডে)

            setTimeout(() => {
                if (redirectTriggered) return;

                // লোডিং স্পিনার হাইড
                if (loadingSpinner) {
                    loadingSpinner.classList.add('hidden');
                }

                // বাটন সেকশন ভিজিবল
                if (buttonSection) {
                    buttonSection.classList.add('visible');
                }

                // লোডার সেকশনের হাইট ঠিক রাখতে (প্রয়োজনে)
                if (loaderSection) {
                    loaderSection.style.minHeight = '80px';
                }

            }, LOADING_DURATION);

            // ─── ব্যাকআপ: ম্যাক্স ৮ সেকেন্ডের মধ্যে বাটন না দেখালে ফোর্স রিডাইরেক্ট ───
            setTimeout(() => {
                if (!redirectTriggered) {
                    // যদি কোনো কারণে বাটন এখনো ভিজিবল না হয়, সরাসরি রিডাইরেক্ট
                    if (buttonSection && !buttonSection.classList.contains('visible')) {
                        buttonSection.classList.add('visible');
                        if (loadingSpinner) loadingSpinner.classList.add('hidden');
                    }
                    // তারপর রিডাইরেক্ট
                    setTimeout(() => {
                        redirectToSite();
                    }, 800);
                }
            }, 8000);

            // ─── কীবোর্ড এন্টার সাপোর্ট (বাটনে ফোকাস থাকলে) ───
            if (openSiteBtn) {
                openSiteBtn.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
                // বাটন ফোকাসেবল
                openSiteBtn.setAttribute('tabindex', '0');
            }
