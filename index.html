<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Viral Video Link - Premium Unlock System</title>
  <style>
    /* ========== CSS RESET & BASE ========== */
    :root {
      --bg: #0a0e17;
      --bg-card: #121a28;
      --bg-card-hover: #182234;
      --text: #ffffff;
      --text-muted: #a0aab8;
      --border: #2a3446;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --green: #10b981;
      --green-hover: #059669;
      --red: #ef4444;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      --radius: 14px;
      --radius-sm: 8px;
      --transition: all 0.3s ease;
      --font: 'Segoe UI', 'Noto Sans Bengali', Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== HEADER ========== */
    .site-header {
      background: #0d1420;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.6rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
      padding: 6px 12px;
      border-radius: 6px;
    }
    .nav a:hover {
      color: #fff;
      background: rgba(255,255,255,0.05);
    }

    /* ========== HERO SECTION ========== */
    .hero {
      width: 100%;
      max-width: 1200px;
      margin: 24px auto 10px;
      padding: 0 20px;
      text-align: center;
    }
    .hero img {
      width: 100%;
      height: auto;
      max-height: 350px;
      object-fit: cover;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .hero img:hover {
      transform: scale(1.01);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
    }
    .hero h1 {
      font-size: 2.2rem;
      margin: 20px 0 8px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ========== VIDEO GRID ========== */
    .grid-container {
      max-width: 1400px;
      margin: 20px auto 40px;
      padding: 0 20px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    /* ========== VIDEO CARD ========== */
    .video-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }
    .video-card:hover {
      background: var(--bg-card-hover);
      border-color: #3e4c63;
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
    }

    /* Ad slots (2 small ads above each card) */
    .ad-slots {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: #0b111d;
      border-bottom: 1px solid var(--border);
    }
    .ad-slot {
      flex: 1;
      height: 80px;
      background: #0d1420;
      border: 1.5px dashed #2a3446;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 0.7rem;
      color: #6b7a90;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      padding: 4px;
      text-align: center;
    }
    .ad-slot:hover {
      border-color: #4a5a78;
      background: #0f1726;
    }
    .ad-slot .ad-label {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4a5a78;
    }
    .ad-slot svg {
      width: 18px;
      height: 18px;
      margin-bottom: 4px;
      opacity: 0.5;
    }

    /* Thumbnail */
    .thumb {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      display: block;
    }
    .thumb:hover img {
      transform: scale(1.05);
    }
    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,0.5);
      pointer-events: none;
    }
    .play-overlay svg {
      width: 22px;
      height: 22px;
      fill: #fff;
      margin-left: 3px;
    }
    .duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.8);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      pointer-events: none;
    }

    /* Card content */
    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .video-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 42px;
    }
    .video-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }
    .video-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Unlock button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: 0.3px;
      width: 100%;
      font-family: var(--font);
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
    }
    .btn-primary:disabled {
      background: #2a3446;
      color: #6b7a90;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-success {
      background: var(--green);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }
    .btn-success:hover {
      background: var(--green-hover);
      transform: translateY(-2px);
    }
    .btn-waiting {
      background: #1e293b;
      color: var(--accent);
      border: 2px solid var(--accent);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 1s linear;
    }

    /* Video player */
    .player-container {
      display: none;
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16/9;
      border: 2px solid var(--green);
    }
    .player-container.active {
      display: block;
      animation: fadeIn 0.5s;
    }
    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 9999;
      transform: translateX(120%);
      transition: transform 0.4s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      max-width: 350px;
    }
    .toast.show {
      transform: translateX(0);
    }
    .toast.success { border-left: 4px solid var(--green); }
    .toast.error { border-left: 4px solid var(--red); }

    /* Responsive */
    @media (max-width: 600px) {
      .hero h1 { font-size: 1.5rem; }
      .video-grid { grid-template-columns: 1fr; }
      .btn { font-size: 0.85rem; padding: 10px 12px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="#" class="logo">
      <div class="logo-icon">▶</div>
      <span>ViralHub</span>
    </a>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#videos">Videos</a>
      <a href="#">Trending</a>
      <a href="#">About</a>
    </nav>
  </header>

  <!-- Hero Section with Image from imgbb -->
  <div class="hero">
    <!-- ⚠️ Replace the src below with your own i.ibb.co image link -->
    <img src="https://i.ibb.co/0VzZ5yN/hero-banner.jpg" alt="Main Banner" />
    <h1>🔥 All Viral Video Link</h1>
    <p>Watch exclusive premium videos by unlocking them with a few simple ads. No annoying pop-ups – just 5 quick ad views per video!</p>
  </div>

  <!-- Video Grid -->
  <main class="grid-container" id="videos">
    <div class="video-grid" id="videoGrid"></div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span id="toastIcon">✅</span>
    <span id="toastMessage"></span>
  </div>

  <script>
    // ============================================================
    // CONFIGURATION - EDIT THESE VALUES
    // ============================================================

    /**
     * 🔴 ADSTERRA DIRECT LINK
     * Replace with your own Adsterra direct link.
     * Example: https://www.profitablecpmrate.com/xyz123
     */
    const ADSTERRA_LINK = "https://daily-earning-1.vercel.app";

    /**
     *🔴 HERO IMAGE URL (i.ibb.co link)
     * Replace with your actual image link from imgbb.
     */
    const HERO_IMAGE_URL = "https://i.ibb.co/0VzZ5yN/hero-banner.jpg";

    /**
     * ⏱️ Number of seconds user must wait after clicking before the ad counts as viewed.
     * Set to 30 as requested.
     */
    const WAIT_SECONDS = 30;

    /**
     * 📢 Number of ad views required before video unlocks.
     * Set to 5 as requested.
     */
    const ADS_REQUIRED = 5;

    /**
     * 🎬 Video data array.
     * Replace thumbnail and embedUrl with your own.
     * thumbnail: use i.ibb.co image links
     * embedUrl: any embeddable video URL (YouTube embed, Vimeo, etc.)
     */
    const videos = [
      {
        id: 1,
        title: "Viral Video #1: Amazing Street Magic",
        thumbnail: "https://i.ibb.co/0VzZ5yN/hero-banner.jpg", // replace with actual imgbb link
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
        duration: "12:45",
        views: "2.3M views"
      },
      {
        id: 2,
        title: "Viral Video #2: Epic Fail Compilation",
        thumbnail: "https://i.ibb.co/0VzZ5yN/hero-banner.jpg",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
        duration: "08:20",
        views: "5.1M views"
      },
      {
        id: 3,
        title: "Viral Video #3: Cute Animals",
        thumbnail: "https://i.ibb.co/0VzZ5yN/hero-banner.jpg",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
        duration: "05:10",
        views: "10M views"
      },
      {
        id: 4,
        title: "Viral Video #4: Extreme Sports",
        thumbnail: "https://i.ibb.co/0VzZ5yN/hero-banner.jpg",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
        duration: "15:30",
        views: "1.8M views"
      },
      {
        id: 5,
        title: "Viral Video #5: Cooking Hacks",
        thumbnail: "https://i.ibb.co/0VzZ5yN/hero-banner.jpg",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
        duration: "07:55",
        views: "3.6M views"
      },
      {
        id: 6,
        title: "Viral Video #6: Travel Vlog",
        thumbnail: "https://i.ibb.co/0VzZ5yN/hero-banner.jpg",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
        duration: "22:15",
        views: "4.4M views"
      },
      {
        id: 7,
        title: "Viral Video #7: Tech Review",
        thumbnail: "https://i.ibb.co/0VzZ5yN/hero-banner.jpg",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
        duration: "18:40",
        views: "6.2M views"
      },
      {
        id: 8,
        title: "Viral Video #8: Comedy Skit",
        thumbnail: "https://i.ibb.co/0VzZ5yN/hero-banner.jpg",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
        duration: "09:25",
        views: "7.9M views"
      }
    ];

    // ============================================================
    // LOCAL STORAGE HELPERS
    // ============================================================
    const STORAGE_KEY = 'viralhub_ad_counts';

    function getAdCounts() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveAdCount(videoId, count) {
      const counts = getAdCounts();
      counts[videoId] = count;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
    }

    function getAdCount(videoId) {
      return getAdCounts()[videoId] || 0;
    }

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      const msg = document.getElementById('toastMessage');
      icon.textContent = type === 'success' ? '✅' : '⚠️';
      msg.textContent = message;
      toast.classList.remove('success', 'error');
      toast.classList.add(type);
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ============================================================
    // RENDER VIDEOS
    // ============================================================
    function renderVideos() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = videos.map(v => {
        const adCount = getAdCount(v.id);
        const isUnlocked = adCount >= ADS_REQUIRED;
        const buttonText = isUnlocked ? 'Open Video' : 'Unlock Video';
        const buttonClass = isUnlocked ? 'btn btn-success' : 'btn btn-primary';
        const progressPercent = Math.min((adCount / ADS_REQUIRED) * 100, 100);

        return `
          <div class="video-card" data-id="${v.id}">
            <!-- 2 small ad slots -->
            <div class="ad-slots">
              <div class="ad-slot">
                <span class="ad-label">AD 1</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                  <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                <span>Paste Adsterra code</span>
              </div>
              <div class="ad-slot">
                <span class="ad-label">AD 2</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                  <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                <span>Paste Adsterra code</span>
              </div>
            </div>

            <!-- Thumbnail -->
            <div class="thumb">
              <img src="${v.thumbnail}" alt="${v.title}" loading="lazy" />
              <div class="play-overlay">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </div>
              <span class="duration">${v.duration}</span>
            </div>

            <!-- Card body -->
            <div class="card-body">
              <div class="video-title">${v.title}</div>
              <div class="video-meta">
                <span>👁️ ${v.views}</span>
                <span>⏱️ ${v.duration}</span>
                <span class="ad-progress">📢 ${adCount}/${ADS_REQUIRED} ads viewed</span>
              </div>

              <!-- Progress bar -->
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${progressPercent}%"></div>
              </div>

              <!-- Button -->
              <button class="${buttonClass}" data-id="${v.id}" ${isUnlocked ? '' : ''}>
                ${isUnlocked ? '▶️ Open Video' : '🔓 ' + buttonText}
              </button>

              <!-- Player (hidden until unlocked) -->
              <div class="player-container ${isUnlocked ? 'active' : ''}">
                <iframe src="${isUnlocked ? v.embedUrl : 'about:blank'}" 
                        title="${v.title}" 
                        allowfullscreen></iframe>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ============================================================
    // UNLOCK FLOW (30 seconds per ad, 5 ads required)
    // ============================================================
    function handleButtonClick(e) {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const videoId = parseInt(btn.getAttribute('data-id'));
      const video = videos.find(v => v.id === videoId);
      if (!video) return;

      const adCount = getAdCount(videoId);
      const card = btn.closest('.video-card');

      // If already unlocked, show player (already visible) - do nothing
      if (adCount >= ADS_REQUIRED) {
        const player = card.querySelector('.player-container');
        if (player) player.classList.add('active');
        return;
      }

      // If button is in waiting state (disabled), ignore
      if (btn.disabled) return;

      // Disable button and start countdown
      btn.disabled = true;
      btn.classList.remove('btn-primary');
      btn.classList.add('btn-waiting');
      btn.innerHTML = `⏳ Wait ${WAIT_SECONDS}s...`;

      // Open Adsterra link in new tab
      if (ADSTERRA_LINK && ADSTERRA_LINK !== "https://www.profitablecpmrate.com/YOUR_DIRECT_LINK_HERE") {
        window.open(ADSTERRA_LINK, '_blank', 'noopener,noreferrer');
        showToast('📢 Ad opened in new tab. Please wait...', 'success');
      } else {
        console.warn('⚠️ Adsterra link not set. Please configure ADSTERRA_LINK.');
        showToast('⚠️ Adsterra link missing!', 'error');
      }

      // Countdown timer
      let secondsLeft = WAIT_SECONDS;
      const countdownInterval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          btn.innerHTML = `⏳ Wait ${secondsLeft}s...`;
        } else {
          clearInterval(countdownInterval);
          // Increment ad count
          const newCount = adCount + 1;
          saveAdCount(videoId, newCount);

          if (newCount >= ADS_REQUIRED) {
            // Unlocked!
            btn.classList.remove('btn-waiting');
            btn.classList.add('btn-success');
            btn.disabled = false;
            btn.innerHTML = '▶️ Open Video';
            // Show player
            const player = card.querySelector('.player-container');
            if (player) {
              player.classList.add('active');
              player.querySelector('iframe').src = video.embedUrl;
            }
            showToast('🎉 Video unlocked! Enjoy!', 'success');
          } else {
            // Still more ads needed
            btn.classList.remove('btn-waiting');
            btn.classList.add('btn-primary');
            btn.disabled = false;
            btn.innerHTML = `🔓 Watch Ad ${newCount+1}/${ADS_REQUIRED}`;
            showToast(`✅ Ad ${newCount}/${ADS_REQUIRED} viewed. ${ADS_REQUIRED-newCount} more to unlock.`, 'success');
          }
          // Update progress bar
          const progressFill = card.querySelector('.progress-fill');
          if (progressFill) {
            progressFill.style.width = `${Math.min((newCount / ADS_REQUIRED) * 100, 100)}%`;
          }
          const adProgress = card.querySelector('.ad-progress');
          if (adProgress) {
            adProgress.textContent = `📢 ${newCount}/${ADS_REQUIRED} ads viewed`;
          }
        }
      }, 1000);
    }

    // ============================================================
    // EVENT DELEGATION
    // ============================================================
    document.getElementById('videoGrid').addEventListener('click', handleButtonClick);

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      // Set hero image from config
      const heroImg = document.querySelector('.hero img');
      if (heroImg && HERO_IMAGE_URL) heroImg.src = HERO_IMAGE_URL;
      renderVideos();
    });
  </script>
</body>
</html>
